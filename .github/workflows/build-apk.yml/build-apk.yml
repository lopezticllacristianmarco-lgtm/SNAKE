
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            python3-pip python3-venv autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev libltdl-dev cmake

      - name: Instalar Buildozer
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools
          .venv/bin/pip install "Cython<3" buildozer==1.5.0

      - name: Compilar APK
        run: .venv/bin/buildozer android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: snake-neon-apk
          path: bin/*.apk
          if-no-files-found: error
